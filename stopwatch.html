<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스탑워치</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: #05070f;
    color: #f6ede2;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    padding: 6vh 16px 16px;
    overflow: hidden;
  }
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    padding: 28px 24px;
    background: linear-gradient(135deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .04));
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .4);
  }
  .time {
    margin: 20px 0 24px;
    text-align: center;
    font-size: 56px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-shadow: 0 0 24px rgba(255, 150, 60, .35);
  }
  .time .ms { font-size: 32px; color: #c9a98a; }
  .buttons { display: flex; gap: 10px; }
  button {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    color: #f6ede2;
    background: rgba(255, 255, 255, .12);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
    transition: filter .15s, transform .05s, background .2s;
  }
  button:hover:not(:disabled) { filter: brightness(1.2); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }
  #startBtn { background: rgba(240, 130, 45, .55); }
  #startBtn.running { background: rgba(200, 60, 45, .55); }
  .laps {
    list-style: none;
    margin-top: 20px;
    max-height: 150px;
    overflow-y: auto;
  }
  .laps li {
    display: flex;
    justify-content: space-between;
    padding: 10px 4px;
    border-top: 1px solid rgba(255, 200, 150, .15);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
  }
  .laps .no { color: #c9a98a; }
  .laps .diff { color: #c9a98a; }
  .hint {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: #9c8672;
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="card">
    <div class="time" id="time">00:00<span class="ms">.00</span></div>
    <div class="buttons">
      <button id="startBtn">시작</button>
      <button id="lapBtn" disabled>랩</button>
      <button id="resetBtn" disabled>초기화</button>
    </div>
    <ul class="laps" id="laps"></ul>
    <p class="hint">Space: 시작/정지 · L: 랩 · R: 초기화</p>
  </div>

<script>
  const timeEl = document.getElementById('time');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapsEl = document.getElementById('laps');

  let running = false;
  let startedAt = 0;   // 마지막으로 시작한 시각
  let accumulated = 0; // 정지 전까지 누적된 시간(ms)
  let lastLap = 0;
  let lapCount = 0;
  let rafId = null;

  const pad = (n) => String(n).padStart(2, '0');

  function format(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    return { main: (h ? pad(h) + ':' : '') + pad(m) + ':' + pad(s), cs: pad(cs) };
  }

  const formatText = (ms) => { const f = format(ms); return f.main + '.' + f.cs; };

  const elapsed = () => accumulated + (running ? performance.now() - startedAt : 0);

  function render() {
    const f = format(elapsed());
    timeEl.innerHTML = f.main + '<span class="ms">.' + f.cs + '</span>';
  }

  function tick() {
    render();
    rafId = requestAnimationFrame(tick);
  }

  function toggle() {
    if (running) {
      accumulated = elapsed();
      running = false;
      cancelAnimationFrame(rafId);
      render();
    } else {
      startedAt = performance.now();
      running = true;
      tick();
    }
    startBtn.textContent = running ? '정지' : '계속';
    startBtn.classList.toggle('running', running);
    lapBtn.disabled = !running;
    resetBtn.disabled = false;
  }

  function lap() {
    if (!running) return;
    const now = elapsed();
    const li = document.createElement('li');
    li.innerHTML =
      '<span class="no">랩 ' + (++lapCount) + '</span>' +
      '<span class="diff">+' + formatText(now - lastLap) + '</span>' +
      '<span>' + formatText(now) + '</span>';
    lapsEl.prepend(li);
    lastLap = now;
  }

  function reset() {
    cancelAnimationFrame(rafId);
    running = false;
    accumulated = 0;
    lastLap = 0;
    lapCount = 0;
    lapsEl.innerHTML = '';
    startBtn.textContent = '시작';
    startBtn.classList.remove('running');
    lapBtn.disabled = true;
    resetBtn.disabled = true;
    render();
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lap);
  resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'KeyL') lap();
    else if (e.code === 'KeyR') reset();
  });

  // 포커스된 버튼이 Space 키로 중복 클릭되는 것을 방지
  document.querySelectorAll('button').forEach((b) =>
    b.addEventListener('keyup', (e) => { if (e.code === 'Space') e.preventDefault(); })
  );
</script>

<script>
  // ── 배경: 가을밤 모닥불 ──
  (() => {
    const cv = document.getElementById('scene');
    const ctx = cv.getContext('2d');
    const LEAF_COLORS = ['#c8501e', '#e08a2c', '#b5361c', '#d9a531', '#8f3a1a'];

    let W, H, fx, fy, groundY, size;
    let stars = [], trees = [], leaves = [], flames = [], sparks = [];

    const GROW_MIN = 0.35, GROW_MAX = 1.6;
    const GROW_TIME = 30000; // 클수록 천천히 자람(ms)
    let grow = GROW_MIN;

    // 리사이즈해도 별·나무 배치가 바뀌지 않도록 시드 고정 난수 사용
    function seeded(seed) {
      return () => {
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function newLeaf(anywhere) {
      return {
        x: Math.random() * W,
        y: anywhere ? Math.random() * groundY : -20,
        r: 4 + Math.random() * 5,
        vy: 0.35 + Math.random() * 0.6,
        sway: 0.5 + Math.random() * 1.2,
        phase: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.04,
        rot: Math.random() * Math.PI * 2,
        color: LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)]
      };
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      cv.width = W * dpr;
      cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      groundY = H * 0.86;
      fx = W / 2;
      fy = groundY + H * 0.03;
      size = Math.max(36, Math.min(Math.min(W, H) * 0.1, 95));

      const r = seeded(7);
      stars = Array.from({ length: Math.round(W * H / 6000) }, () => ({
        x: r() * W, y: r() * groundY * 0.8, s: 0.5 + r() * 1.3,
        a: 0.3 + r() * 0.6, sp: 0.0005 + r() * 0.002, ph: r() * 6.28
      }));

      trees = [];
      for (let x = -30; x < W + 60; x += 34 + r() * 46) {
        const h = H * (0.18 + r() * 0.2);
        // 모닥불 주변은 공터로 비워 둠
        if (Math.abs(x - fx) < size * 2.6) continue;
        trees.push({ x, h, w: h * (0.3 + r() * 0.12) });
      }

      leaves = Array.from({ length: Math.round(W / 55) + 8 }, () => newLeaf(true));
    }

    function drawSky(t) {
      const g = ctx.createLinearGradient(0, 0, 0, groundY);
      g.addColorStop(0, '#04060e');
      g.addColorStop(0.6, '#0c1322');
      g.addColorStop(1, '#2b1a14');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      for (const s of stars) {
        ctx.globalAlpha = Math.max(0, s.a + Math.sin(t * s.sp + s.ph) * 0.3);
        ctx.fillStyle = '#fff6e0';
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }
      ctx.globalAlpha = 1;

      // 달
      const mx = W * 0.82, my = H * 0.15, mr = Math.min(W, H) * 0.04;
      const halo = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 5);
      halo.addColorStop(0, 'rgba(240,225,180,.25)');
      halo.addColorStop(1, 'rgba(240,225,180,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
      ctx.fillStyle = '#f3e8c6';
      ctx.beginPath();
      ctx.arc(mx, my, mr, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawTrees() {
      ctx.fillStyle = '#06080a';
      for (const tr of trees) {
        const base = groundY + 4;
        // 세 겹의 삼각형으로 침엽수 실루엣
        for (let i = 0; i < 3; i++) {
          const top = base - tr.h * (1 - i * 0.22);
          const bottom = base - tr.h * (0.42 - i * 0.2);
          const half = tr.w * (0.5 + i * 0.25) / 2 * 1.6;
          ctx.beginPath();
          ctx.moveTo(tr.x, top);
          ctx.lineTo(tr.x - half, bottom);
          ctx.lineTo(tr.x + half, bottom);
          ctx.closePath();
          ctx.fill();
        }
        ctx.fillRect(tr.x - 2, base - tr.h * 0.1, 4, tr.h * 0.1);
      }
    }

    function drawGround(flicker) {
      ctx.fillStyle = '#080605';
      ctx.fillRect(0, groundY, W, H - groundY);

      // 바닥에 비친 불빛
      ctx.save();
      ctx.translate(fx, fy);
      ctx.scale(1, 0.28);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 7 * flicker);
      g.addColorStop(0, 'rgba(255,140,50,.55)');
      g.addColorStop(0.4, 'rgba(200,80,20,.2)');
      g.addColorStop(1, 'rgba(200,80,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, size * 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawGlow(flicker) {
      ctx.globalCompositeOperation = 'lighter';
      const R = size * 8 * flicker;
      const g = ctx.createRadialGradient(fx, fy - size, 0, fx, fy - size, R);
      g.addColorStop(0, 'rgba(255,130,40,.32)');
      g.addColorStop(0.35, 'rgba(255,90,20,.1)');
      g.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = g;
      ctx.fillRect(fx - R, fy - size - R, R * 2, R * 2);
      ctx.globalCompositeOperation = 'source-over';
    }

    function drawLogs() {
      const logs = [[-0.35, 0.32], [0.35, -0.32], [0, 0.04]];
      for (const [dx, ang] of logs) {
        ctx.save();
        ctx.translate(fx + dx * size, fy - size * 0.08);
        ctx.rotate(ang);
        const w = size * 1.9, h = size * 0.26;
        ctx.fillStyle = '#24140c';
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.fillStyle = 'rgba(255,120,40,.5)';
        ctx.fillRect(-w / 2, -h / 2, w, h * 0.22);
        ctx.restore();
      }
      // 화덕 돌
      ctx.fillStyle = '#17120f';
      for (let i = 0; i < 7; i++) {
        const a = Math.PI * (i / 6);
        ctx.beginPath();
        ctx.ellipse(fx + Math.cos(a) * size * 1.25, fy + size * 0.1 + Math.sin(a) * size * 0.28,
          size * 0.24, size * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawFire(dt) {
      const fs = size * grow;
      for (let i = 0; i < 4; i++) {
        flames.push({
          x: fx + (Math.random() - 0.5) * fs * 1.1,
          y: fy - size * 0.15,
          vx: (Math.random() - 0.5) * 0.5,
          vy: -(1.1 + Math.random() * 1.6) * fs / 60,
          r: fs * (0.3 + Math.random() * 0.3),
          life: 1,
          decay: 0.012 + Math.random() * 0.014
        });
      }
      if (Math.random() < 0.25 * grow) {
        sparks.push({
          x: fx + (Math.random() - 0.5) * fs * 0.8,
          y: fy - fs * 0.6,
          vx: (Math.random() - 0.5) * 1.2,
          vy: -(1.5 + Math.random() * 2),
          life: 1,
          decay: 0.005 + Math.random() * 0.008
        });
      }

      ctx.globalCompositeOperation = 'lighter';
      for (let i = flames.length - 1; i >= 0; i--) {
        const p = flames[i];
        p.life -= p.decay * dt;
        if (p.life <= 0) { flames.splice(i, 1); continue; }
        // 위로 갈수록 가운데로 모여 불꽃 모양이 됨
        p.vx += (fx - p.x) * 0.0015 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        const l = p.life;
        const rad = p.r * (0.25 + l * 0.85);
        const c = l > 0.7 ? '255,225,150' : l > 0.4 ? '255,150,45' : '215,60,20';
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
        g.addColorStop(0, 'rgba(' + c + ',' + (l * 0.55) + ')');
        g.addColorStop(1, 'rgba(' + c + ',0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.life -= s.decay * dt;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        s.vx += (Math.random() - 0.5) * 0.15 * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        ctx.fillStyle = 'rgba(255,190,90,' + s.life + ')';
        ctx.fillRect(s.x, s.y, 2, 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function drawLeaves(t, dt) {
      for (let i = 0; i < leaves.length; i++) {
        const lf = leaves[i];
        lf.y += lf.vy * dt;
        lf.x += Math.sin(t * 0.001 * lf.sway + lf.phase) * 0.6 * dt;
        lf.rot += lf.spin * dt;
        if (lf.y > groundY + 10) { leaves[i] = newLeaf(false); continue; }

        ctx.save();
        ctx.translate(lf.x, lf.y);
        ctx.rotate(lf.rot);
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = lf.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, lf.r, lf.r * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    let prev = performance.now();
    function frame(t) {
      // 탭 복귀 시 큰 시간 점프로 입자가 튀지 않도록 dt 상한
      const dt = Math.min((t - prev) / 16.67, 3);
      prev = t;
      // 스탑워치 경과 시간에 따라 불꽃이 GROW_MIN → GROW_MAX로 자라고, 초기화하면 다시 줄어듦
      const target = GROW_MIN + (GROW_MAX - GROW_MIN) * (1 - Math.exp(-elapsed() / GROW_TIME));
      grow += (target - grow) * Math.min(0.03 * dt, 1);
      const flicker = (0.92 + Math.sin(t * 0.011) * 0.04 + Math.sin(t * 0.027) * 0.03)
        * (0.45 + grow * 0.55);

      drawSky(t);
      drawTrees();
      drawGround(flicker);
      drawGlow(flicker);
      drawLogs();
      drawFire(dt);
      drawLeaves(t, dt);
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
